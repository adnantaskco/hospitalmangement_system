services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-nextjs
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://hospital_user:hospital_password@postgres:5432/hospital_db
    depends_on:
      - postgres
    command: npm run dev

  postgres:
    image: postgres:16
    container_name: hospital-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hospital_db
      POSTGRES_USER: hospital_user
      POSTGRES_PASSWORD: hospital_password
    ports:
      - "5433:5432"
    volumes:
      - hospital_postgres_data:/var/lib/postgresql/data

volumes:
  hospital_postgres_data: